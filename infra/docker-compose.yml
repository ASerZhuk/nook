services:
  api:
    build: ../apps/api
    env_file: .env
    environment:
      DATABASE_URL: sqlite+aiosqlite:////data/app.db
      VAPID_FILE: /data/vapid.json
      MEDIA_DIR: /data/media
    volumes:
      - dbdata:/data
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    environment:
      API_INTERNAL_URL: http://api:8000
    depends_on:
      - api
    restart: unless-stopped

  caddy:
    image: caddy:2
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - web
    restart: unless-stopped

volumes:
  dbdata:
  caddy_data:
  caddy_config:
